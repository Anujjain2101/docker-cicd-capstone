name: Docker CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint and Build Docker Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint Dockerfile using Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build Docker Image
        run: docker build --pull -t winter-arc-app:ci .

      - name: Run Container and Smoke Test
        run: |
          docker run -d --name ci-test -p 5000:5000 winter-arc-app:ci

          echo "Waiting for application to become ready..."

          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health > /dev/null; then
              echo "Application is responding."
              break
            fi
            sleep 2
          done

          bash scripts/smoke-test.sh

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: winter-arc-app:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/winter-arc-app
          SHA: ${{ github.sha }}
        run: |
          docker tag winter-arc-app:ci "$IMAGE:$SHA"
          docker push "$IMAGE:$SHA"

  deploy-test:
    name: Deploy to Ubuntu EC2
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy application over SSH
        env:
          TEST_HOST: ${{ secrets.TEST_HOST }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
          TEST_KNOWN_HOSTS: ${{ secrets.TEST_KNOWN_HOSTS }}
          IMAGE_SHA: ${{ github.sha }}

        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$TEST_SSH_KEY" > ~/.ssh/ec2_deploy
          chmod 600 ~/.ssh/ec2_deploy

          printf '%s\n' "$TEST_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$TEST_USER@$TEST_HOST" \
            "sudo -n /usr/local/bin/deploy-winter-arc $IMAGE_SHA"
